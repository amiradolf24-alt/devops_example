name: Docker CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t mon-app ./app

      - name: Run container
        run: docker run -d -p 8080:80 --name mon-site mon-app

      - name: Smoke test
        run: |
          sleep 3
          curl -f http://localhost:8080

      - name: Show logs
        if: always()
        run: docker logs mon-site
